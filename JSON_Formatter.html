<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSON Formatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tools.css">
<style>
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    min-height: calc(100dvh - 58px);
    height: calc(100dvh - 58px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
    max-width: 1500px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
  }
  h1 {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 auto 0 0;
    color: var(--ink);
  }
  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  button, select {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    min-height: 32px;
    line-height: 1.2;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  select {
    background: var(--panel);
  }
  button:hover:not(:disabled) {
    background: var(--ink);
    color: var(--bg);
  }
  select:hover {
    border-color: var(--accent);
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  button:disabled:hover {
    background: transparent;
    color: var(--ink);
  }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:active:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary {
    background: var(--ink);
    border: 1px solid var(--ink);
    color: var(--bg);
    font-weight: 500;
  }
  button.primary:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary:active:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary:disabled:hover {
    background: var(--ink);
    color: var(--bg);
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
  }
  .hint.kbd {
    font-family: var(--mono);
    font-size: 12px;
  }

  .panes {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 800px) {
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .hint.kbd { display: none; }
  }
  .pane {
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 46px;
    padding: 6px 8px 6px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    font-weight: 500;
    font-size: 14px;
  }
  .pane-head > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .meta {
    font-family: var(--mono);
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    margin-left: 8px;
  }
  .pane-head .meta.ok { color: var(--ok); }
  .pane-head .meta.bad { color: var(--err); }
  .pane-head button { padding: 5px 12px; min-height: 32px; white-space: nowrap; }
  #copy.done {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  /* ---------- editor ---------- */
  .edhost {
    --fs: 13px;
    --lh: 21px;
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 800px) {
    .edhost { --fs: 16px; --lh: 24px; }
  }
  .edwrap { flex: 1; min-height: 0; position: relative; display: flex; }
  .scroller { flex: 1; min-width: 0; overflow: auto; position: relative; }
  .stack {
    position: relative;
    min-height: 100%;
    min-width: 100%;
    width: max-content;
    font: 400 var(--fs)/var(--lh) var(--mono);
    background-image: linear-gradient(to right,
      var(--panel-2) calc(var(--gutter, 44px) - 1px),
      var(--line) calc(var(--gutter, 44px) - 1px),
      var(--line) var(--gutter, 44px),
      transparent var(--gutter, 44px));
  }
  .hl, .ml, .edhost textarea {
    margin: 0;
    border: 0;
    font: inherit;
    letter-spacing: 0;
    font-variant-ligatures: none;
    tab-size: 2;
    white-space: pre;
  }
  .hl, .ml { padding: 12px 14px 12px calc(var(--gutter, 44px) + 12px); }
  .ml { position: absolute; inset: 0; color: transparent; z-index: 0; pointer-events: none; }
  .hl { position: relative; z-index: 1; pointer-events: none; color: var(--ink); }
  .edhost textarea {
    position: absolute;
    inset: 0 0 0 var(--gutter, 44px);
    padding: 12px 14px 12px 12px;
    z-index: 2;
    resize: none;
    overflow: hidden;
    outline: none;
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: var(--ink);
  }
  .edhost textarea::placeholder { color: var(--muted); -webkit-text-fill-color: var(--muted); }
  .edhost textarea::selection { background: var(--sel); }
  .edhost.wrap .hl, .edhost.wrap .ml, .edhost.wrap textarea { white-space: pre-wrap; overflow-wrap: anywhere; }
  .edhost.wrap .stack { width: 100%; }
  .edhost.plain { --gutter: 0px; }
  .ln { position: relative; min-height: var(--lh); }
  .hl .ln::before {
    content: attr(data-n);
    position: absolute;
    left: calc(-1 * (var(--gutter, 44px) + 12px));
    width: calc(var(--gutter, 44px) - 24px);
    text-align: right;
    color: var(--muted);
    opacity: 0.6;
    user-select: none;
  }
  .fold {
    position: absolute;
    left: -34px;
    top: 0;
    width: 20px;
    height: var(--lh);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    user-select: none;
  }
  .fold::before {
    content: "";
    width: 6px;
    height: 6px;
    border-right: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor;
    transform: translateY(-2px) rotate(45deg);
  }
  .fold.closed::before { transform: translateX(-2px) rotate(-45deg); }
  .edhost:hover .fold, .fold.closed { opacity: 1; }
  .fold:hover { color: var(--ink); }
  .fold-ph {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    cursor: pointer;
    pointer-events: auto;
  }
  .edhost.folded .hl { pointer-events: auto; user-select: text; cursor: text; }
  .edhost.folded textarea { visibility: hidden; }
  .foldbar {
    display: none;
    position: absolute;
    top: 8px;
    right: 22px;
    z-index: 3;
    align-items: center;
    gap: 8px;
    padding: 3px 4px 3px 12px;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  .edhost.folded .foldbar { display: flex; }
  .foldbar button { min-height: 26px; padding: 2px 10px; font-size: 12px; border-radius: 999px; }
  .ml mark { background: var(--mk); color: transparent; border-radius: 2px; }
  .ml mark.cur { background: var(--mk-cur); }

  /* find / replace bar */
  .find {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .find.open { display: flex; }
  .find .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .find .rep-row { display: none; }
  .find.rep .rep-row { display: flex; }
  .find input {
    flex: 1 1 140px;
    min-width: 0;
    min-height: 32px;
    padding: 4px 9px;
    font: 13px var(--mono);
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .find input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .find button { min-height: 32px; padding: 3px 10px; font-size: 13px; }
  .find .cnt { font-size: 12px; color: var(--muted); min-width: 58px; text-align: center; white-space: nowrap; font-family: var(--mono); }
  .find .cnt.none { color: var(--err); }
  @media (max-width: 800px) { .find input { font-size: 16px; } }

  .actions { display: flex; align-items: center; gap: 6px; }
  button.toggle[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }

  .tk { color: var(--t-key); }
  .ts { color: var(--t-str); }
  .tn { color: var(--t-num); }
  .tl { color: var(--t-lit); }
  .tp { color: var(--t-punc); }

  .error {
    display: none;
    margin: 0;
    padding: 10px 14px;
    background: var(--err-bg);
    color: var(--err);
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .error.show { display: block; }
  .error code { font-family: var(--mono); font-size: 12px; }
</style>
<script src="theme.js"></script>
</head>

<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="site-brand">Jayasuriya <em>MK</em></a>
    <nav class="site-nav">
      <a href="index.html" class="site-nav-link">Home</a>

      <a href="JSON_Formatter.html" class="site-nav-link" aria-current="page">Formatter</a>
      <a href="JSON_Diff.html" class="site-nav-link">Diff</a>
      <button type="button" class="site-theme-toggle" data-theme-toggle>

      </button>

<div class="app">
  <div class="bar">
    <h1>JSON formatter</h1>
    <div class="controls">
      <span class="hint kbd">Ctrl/⌘+Enter format · Ctrl/⌘+F find · Ctrl/⌘+H replace</span>
      <select id="indent" aria-label="Indentation">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
      <button id="wrap" type="button" class="toggle" aria-pressed="false" title="Wrap long lines so nothing scrolls sideways">Word wrap</button>
      <button id="minify" type="button">Minify</button>
      <button id="clear" type="button">Clear</button>
      <button id="format" type="button" class="primary">Format</button>
    </div>
  </div>

  <div class="panes">
    <section class="pane" aria-label="Input">
      <div class="pane-head">
        <span>Input<span class="meta" id="inMeta"></span></span>
        <span class="actions">
          <button id="inFold" type="button" title="Fold / unfold all blocks" disabled>Fold all</button>
          <button id="inFind" type="button" title="Find / replace (Ctrl/⌘+F)">Find</button>
        </span>
      </div>
      <div class="edhost" id="inHost"></div>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section class="pane" aria-label="Output">
      <div class="pane-head">
        <span>Formatted<span class="meta" id="outMeta"></span></span>
        <span class="actions">
          <button id="outFold" type="button" title="Fold / unfold all blocks" disabled>Fold all</button>
          <button id="outFind" type="button" title="Find / replace (Ctrl/⌘+F)">Find</button>
          <button id="copy" type="button" disabled>Copy</button>
        </span>
      </div>
      <div class="edhost" id="outHost"></div>
    </section>
  </div>
</div>

<footer class="site-footer">

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var errorBox = $("error");
  var copyBtn = $("copy"), inMeta = $("inMeta"), outMeta = $("outMeta");
  var indentSel = $("indent");
  var copyTimer = null;
  var currentMode = "format";            // "format" | "minify"
  var inputDirty = false;                // input edited since the last Format
  var minifyBtn = $("minify");
  var wrapBtn = $("wrap");
  var inEd, outEd;                       // created at the bottom

  // The Minify button turns into "Expand" while the output is minified.
  function setMode(m) {
    currentMode = m;
    minifyBtn.textContent = m === "minify" ? "Expand" : "Minify";
  }

  function setWrap(on) {
    inEd.setWrap(on); outEd.setWrap(on);
    wrapBtn.setAttribute("aria-pressed", on ? "true" : "false");
    try { localStorage.setItem("jsonFormatterWrap", on ? "1" : "0"); } catch (e) {}
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }

  // Re-serialises the original text token by token, so number literals and
  // key order stay exactly as written. JSON.parse + stringify would round
  // large integers and reorder integer-like keys.
  function rewrite(text, unit) {
    var out = [], level = 0, i = 0, n = text.length;
    var pretty = unit !== null;
    function pad(l) { return pretty ? "\n" + unit.repeat(l) : ""; }
    function isWs(c) { return c === " " || c === "\n" || c === "\r" || c === "\t"; }
    while (i < n) {
      var c = text[i];
      if (isWs(c)) { i++; continue; }
      if (c === '"') {
        var j = i + 1;
        while (j < n && text[j] !== '"') { j += text[j] === "\\" ? 2 : 1; }
        out.push(text.slice(i, j + 1));
        i = j + 1;
      } else if (c === "{" || c === "[") {
        var k = i + 1;
        while (k < n && isWs(text[k])) k++;
        var close = c === "{" ? "}" : "]";
        if (text[k] === close) { out.push(c + close); i = k + 1; }
        else { level++; out.push(c + pad(level)); i++; }
      } else if (c === "}" || c === "]") {
        level--; out.push(pad(level) + c); i++;
      } else if (c === ",") {
        out.push("," + pad(level)); i++;
      } else if (c === ":") {
        out.push(pretty ? ": " : ":"); i++;
      } else {
        var m = i;
        while (m < n && !isWs(text[m]) && ",:]}".indexOf(text[m]) === -1) m++;
        out.push(text.slice(i, m));
        i = m;
      }
    }
    return out.join("");
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|[{}\[\],:]/g;
  function highlight(text) {
    return esc(text).replace(TOKEN, function (m, str, colon, lit) {
      if (str) return colon
        ? '<span class="tk">' + str + '</span><span class="tp">' + colon + "</span>"
        : '<span class="ts">' + str + "</span>";
      if (lit) return '<span class="tl">' + m + "</span>";
      if (/^[{}\[\],:]$/.test(m)) return '<span class="tp">' + m + "</span>";
      return '<span class="tn">' + m + "</span>";
    });
  }

  // ---- rust debug start
  // Decodes a Rust string literal ("..." with Rust escapes) starting at src[i].
  // Returns { s: decoded string, end: index after the closing quote }.
  function decodeRustString(src, i) {
    var n = src.length, out = "", start = i;
    i++;
    while (i < n && src[i] !== '"') {
      var c = src[i];
      if (c === "\\") {
        var d = src[i + 1]; i += 2;
        if (d === "n") out += "\n";
        else if (d === "r") out += "\r";
        else if (d === "t") out += "\t";
        else if (d === "0") out += "\0";
        else if (d === "\\" || d === '"' || d === "'") out += d;
        else if (d === "u") {
          var m = /^\{([0-9a-fA-F]{1,6})\}/.exec(src.slice(i, i + 9));
          if (!m) throw new Error("bad \\u escape at character " + i);
          out += String.fromCodePoint(parseInt(m[1], 16));
          i += m[0].length;
        } else if (d === "x") {
          out += String.fromCharCode(parseInt(src.slice(i, i + 2), 16));
          i += 2;
        } else throw new Error("bad escape \\" + d + " at character " + (i - 2));
      } else { out += c; i++; }
    }
    if (i >= n) throw new Error("unterminated string starting at character " + start);
    return { s: out, end: i + 1 };
  }

  // Converts the `{:?}` / `{:#?}` output of a serde_json::Value, e.g.
  //   Some(Object {"a": String("x"), "n": Number(1.5), "l": Array [Null, Bool(true)]})
  // into JSON text. Number literals are copied verbatim (no precision loss).
  function debugToJson(src) {
    var i = 0, n = src.length;
    function fail(m) { throw new Error(m + " at character " + i); }
    function ws() {
      while (i < n) {
        var c = src.charCodeAt(i);
        if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break;
      }
    }
    function peek(s) { ws(); return src.slice(i, i + s.length) === s; }
    function eat(s) { if (!peek(s)) fail("expected '" + s + "'"); i += s.length; }
    function rustString() {
      ws();
      if (src[i] !== '"') fail("expected a string");
      var r = decodeRustString(src, i);
      i = r.end;
      return JSON.stringify(r.s);
    }
    function value() {
      ws();
      if (peek("Some(")) { eat("Some("); var sv = value(); eat(")"); return sv; }
      if (peek("None")) { eat("None"); return "null"; }
      if (peek("Null")) { eat("Null"); return "null"; }
      if (peek("Bool(")) {
        eat("Bool(");
        var b;
        if (peek("true")) { eat("true"); b = "true"; } else { eat("false"); b = "false"; }
        eat(")");
        return b;
      }
      if (peek("Number(")) {
        eat("Number("); ws();
        var j = i;
        while (j < n && src[j] !== ")") j++;
        var num = src.slice(i, j).trim();
        if (!/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(num)) fail("bad number '" + num + "'");
        i = j; eat(")");
        return num;
      }
      if (peek("String(")) { eat("String("); var s = rustString(); eat(")"); return s; }
      if (peek("Array")) {
        eat("Array"); eat("[");
        var items = [];
        while (!peek("]")) {
          items.push(value());
          if (peek(",")) eat(","); else break;
        }
        eat("]");
        return "[" + items.join(",") + "]";
      }
      if (peek("Object")) {
        eat("Object"); eat("{");
        var ent = [];
        while (!peek("}")) {
          var k = rustString(); eat(":");
          ent.push(k + ":" + value());
          if (peek(",")) eat(","); else break;
        }
        eat("}");
        return "{" + ent.join(",") + "}";
      }
      fail("unexpected token");
    }
    var res = value(); ws();
    if (i < n) fail("unexpected trailing text");
    return res;
  }

  // Also matches the JSON-escaped form: Some(Object {\"a\": String(\"x\")})
  var DEBUG_START = /^\s*(?:Some\(\s*)?(?:Object\s*\{|Array\s*\[|String\(\s*\\?"|Number\(|Bool\(|Null\b)/;
  function looksLikeDebug(s) { return DEBUG_START.test(s); }

  // Raw pasted debug text. Returns null when the text isn't debug output,
  // throws when it looks like debug output but can't be converted.
  function tryDebug(text) {
    if (!looksLikeDebug(text)) return null;
    try { return debugToJson(text); }
    catch (e1) {
      if (text.indexOf('\\"') !== -1) {
        var unescaped = null;
        try { unescaped = JSON.parse('"' + text + '"'); } catch (e) {}
        if (unescaped !== null) { try { return debugToJson(unescaped); } catch (e) {} }
      }
      throw e1;
    }
  }

  // Walks parsed JSON and swaps string fields that hold either
  //   - a JSON object/array encoded as a string ("{\"a\": 1}"), or
  //   - Rust debug output,
  // for a placeholder; the converted text is spliced back in by splice().
  // Nested cases (JSON string inside a JSON string, debug inside either) are
  // expanded recursively. ctx = { texts: [], dbg: 0, json: 0 }.
  function expandDebug(v, ctx) {
    if (typeof v === "string") {
      var t = v.trim(), c = t.charAt(0), e = t.charAt(t.length - 1);
      if ((c === "{" && e === "}") || (c === "[" && e === "]")) {
        var inner;
        try { inner = JSON.parse(protectNumbers(t)); } catch (err) { inner = undefined; }
        if (inner !== undefined) {
          var dbgBefore = ctx.dbg, jsonBefore = ctx.json;
          var sub = expandDebug(inner, ctx);
          ctx.json++;
          // Keep the original text (exact numbers) unless something inside changed.

      var re = compile();
      if (!re || re instanceof Error || cur < 0) return;
      var r = ranges[cur], rep = rIn.value;
      if (isOn(bRx)) {
        var y = new RegExp(re.source, re.flags.replace("g", "") + "y");
        y.lastIndex = r.s;
        var m = y.exec(ta.value);
        if (m) rep = expandReplacement(rIn.value, m);
      }
      from = r.s + rep.length;
      edit(r.s, r.e, rep);
      renderNow();
      if (ranges.length) go(cur, true);
    }

    function replaceAll() {
      unfoldAll();
      var re = compile();
      if (!re || re instanceof Error) return;
      var src = ta.value, out = "", last = 0, n = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(src)) !== null) {
        if (m[0] === "") { re.lastIndex++; continue; }
        out += src.slice(last, m.index) + (isOn(bRx) ? expandReplacement(rIn.value, m) : rIn.value);
        last = m.index + m[0].length;
        n++;
      }
      if (!n) return;
      out += src.slice(last);
      edit(0, src.length, out);
      renderNow();
      cnt.textContent = "Replaced " + n;
    }

    function openFind(withReplace) {
      findBox.classList.add("open");
      if (withReplace) findBox.classList.add("rep");
      setOn(bTog, findBox.classList.contains("rep"));
      var sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
      if (sel && sel.indexOf("\n") < 0 && sel.length <= 200) fIn.value = sel;
      renderNow();
      (withReplace && fIn.value ? rIn : fIn).focus();
      (withReplace && fIn.value ? rIn : fIn).select();
    }
    function closeFind() {
      findBox.classList.remove("open");
      ranges = []; cur = -1; ml.innerHTML = "";
      ta.focus({ preventScroll: true });
    }

    hl.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest(".fold, .fold-ph") : null;
      if (t) toggleFold(+t.getAttribute("data-l"));
    });
    hl.addEventListener("mousedown", function (e) {
      if (e.target.closest && e.target.closest(".fold")) e.preventDefault();   // keep focus where it is
    });
    q(".f-unfold").addEventListener("click", unfoldAll);

    fIn.addEventListener("input", refresh);
    [bCase, bWord, bRx].forEach(function (b) {
      b.addEventListener("click", function () { setOn(b, !isOn(b)); refresh(); fIn.focus(); });
    });
    bTog.addEventListener("click", function () {
      var on = !findBox.classList.contains("rep");
      findBox.classList.toggle("rep", on); setOn(bTog, on);
      (on ? rIn : fIn).focus();
    });
    q(".f-next").addEventListener("click", function () { if (!ranges.length) search(); go(cur + 1); });
    q(".f-prev").addEventListener("click", function () { if (!ranges.length) search(); go(cur - 1); });
    q(".f-close").addEventListener("click", closeFind);
    q(".f-one").addEventListener("click", replaceOne);
    q(".f-all").addEventListener("click", replaceAll);
    fIn.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); if (!ranges.length) search(); go(cur + (e.shiftKey ? -1 : 1)); }
    });
    rIn.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); if (e.ctrlKey || e.metaKey) replaceAll(); else replaceOne(); }
    });
    host.addEventListener("keydown", function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (mod && !e.altKey && e.code === "KeyF") { e.preventDefault(); openFind(false); }
      else if ((mod && !e.altKey && e.code === "KeyH") || (e.metaKey && e.altKey && e.code === "KeyF")) { e.preventDefault(); openFind(true); }
      else if (mod && e.shiftKey && e.code === "BracketLeft") {          // fold the block around the caret
        e.preventDefault();
        var ln = lineOf(ta.selectionStart), best = -1;
        regions.forEach(function (end, st) { if (st <= ln && ln < end && !folded.has(st) && st > best) best = st; });
        if (best >= 0) { folded.add(best); applyFold(); }
      }
      else if (mod && e.shiftKey && e.code === "BracketRight") { e.preventDefault(); unfoldAll(); }
      else if (e.key === "F3") { e.preventDefault(); if (!ranges.length) search(); go(cur + (e.shiftKey ? -1 : 1)); }
      else if (e.key === "Escape" && findBox.classList.contains("open")) { e.preventDefault(); closeFind(); }
    });

    // ---- public API -------------------------------------------------------
    render();
    return {
      getValue: function () { return ta.value; },
      setValue: function (t) {
        ta.value = t;
        try { ta.setSelectionRange(0, 0); } catch (e) {}
        scroller.scrollTop = 0; scroller.scrollLeft = 0;
        renderNow();
      },
      setSelection: function (a, b) { try { ta.setSelectionRange(a, b); } catch (e) {} },
      focus: function () { ta.focus(); },
      onInput: function (fn) { listeners.push(fn); },
      openFind: openFind,
      setWrap: function (on) {
        host.classList.toggle("wrap", on);
        ta.setAttribute("wrap", on ? "soft" : "off");
      },
      scrollToIndex: function (i) {
        var line = lineOf(i);
        ensureVisible(line);
        var el = hl.querySelector('.ln[data-n="' + (line + 1) + '"]');
        if (el) scroller.scrollTop = Math.max(0, el.offsetTop - scroller.clientHeight / 3);
      },
      foldAll: foldAll,
      unfoldAll: unfoldAll,
      hasFolds: function () { return folded.size > 0; },
      onFold: function (fn) { foldListeners.push(fn); fn({ folded: folded.size > 0, regions: regions.size }); }
    };
  }

  function unitFor(v) { return v === "tab" ? "\t" : " ".repeat(parseInt(v, 10)); }

  function locate(text, err) {
    var msg = String(err && err.message || err);
    var pos = null, line = null, col = null, m;
    if ((m = msg.match(/line (\d+) column (\d+)/i))) { line = +m[1]; col = +m[2]; }
    if ((m = msg.match(/position (\d+)/i))) { pos = +m[1]; }
    if (pos === null && line !== null) {
      var lines = text.split("\n"), p = 0;
      for (var i = 0; i < line - 1 && i < lines.length; i++) p += lines[i].length + 1;
      pos = p + col - 1;
    }
    if (pos !== null && line === null) {
      var before = text.slice(0, pos).split("\n");
      line = before.length; col = before[before.length - 1].length + 1;
    }
    return { msg: msg, pos: pos, line: line, col: col };
  }

  function showError(text, err) {
    var loc = locate(text, err);
    var where = loc.line ? " (line " + loc.line + ", column " + loc.col + ")" : "";
    var snippet = "";
    if (loc.line) {
      var l = text.split("\n")[loc.line - 1] || "";
      if (l.length > 120) l = l.slice(Math.max(0, loc.col - 60), loc.col + 60);
      snippet = "<br><code>" + esc(l) + "</code>";
    }
    errorBox.innerHTML = "<strong>Invalid JSON" + where + ".</strong> " + esc(loc.msg.replace(/^JSON\.parse: /, "")) + snippet;
    errorBox.classList.add("show");
    if (loc.pos !== null && text === inEd.getValue()) {
      inEd.setSelection(loc.pos, Math.min(loc.pos + 1, text.length));
      inEd.focus();
      inEd.scrollToIndex(loc.pos);
    }
  }

  function showPlain(msg) {
    errorBox.innerHTML = "<strong>Conversion failed.</strong> " + esc(msg);
    errorBox.classList.add("show");
  }

  function clearError() { errorBox.classList.remove("show"); errorBox.textContent = ""; }

  function setOutput(text, label) {
    outEd.setValue(text);
    outMeta.className = "meta ok";
    outMeta.textContent = label + " · " + fmtBytes(new Blob([text]).size);
    outMeta.title = outMeta.textContent;
    copyBtn.disabled = false;
  }

  function resetOutput() {
    outEd.setValue("");
    outMeta.textContent = "";
    outMeta.className = "meta";
    copyBtn.disabled = true;
    setMode("format");
  }

  // Live validity for the (editable) output pane.
  var validateTimer = null;
  function onOutputEdited() {
    copyBtn.disabled = !outEd.getValue();
    clearTimeout(validateTimer);
    validateTimer = setTimeout(function () {
      var t = outEd.getValue();
      if (!t.trim()) { outMeta.textContent = ""; outMeta.className = "meta"; return; }
      var size = fmtBytes(new Blob([t]).size);
      try { JSON.parse(t); outMeta.className = "meta ok"; outMeta.textContent = "Valid · edited · " + size; }
      catch (e) {
        var loc = locate(t, e);
        outMeta.className = "meta bad";
        outMeta.textContent = "Invalid JSON" + (loc.line ? " · line " + loc.line + ", col " + loc.col : "") + " · edited";
      }
    }, 250);
  }

  // Re-indent / minify the text currently in the output pane (keeps manual edits).
  function reflow(mode) {
    var t = outEd.getValue().trim();
    if (!t) return false;
    try { JSON.parse(t); }
    catch (e) {
      var loc = locate(t, e);
      outMeta.className = "meta bad";
      outMeta.textContent = "Can't " + (mode === "minify" ? "minify" : "expand") + ": invalid JSON" + (loc.line ? " · line " + loc.line + ", col " + loc.col : "");
      return true;
    }
    var out = rewrite(t, mode === "minify" ? null : unitFor(indentSel.value));
    outEd.setValue(out);
    outMeta.className = "meta ok";
    outMeta.textContent = (mode === "minify" ? "Minified" : "Valid") + " · " + fmtBytes(new Blob([out]).size);
    copyBtn.disabled = false;
    setMode(mode);
    return true;
  }

  function apply(mode) {
    if (!inputDirty && reflow(mode)) return;
    run(mode);
  }

  function run(mode) {
    var text = inEd.getValue().trim();
    clearError();
    if (!text) { resetOutput(); return; }
    var label = mode === "minify" ? "Minified" : "Valid";
    var jsonOk = true, jsonErr;
    try { JSON.parse(text); } catch (e) { jsonOk = false; jsonErr = e; }

    if (!jsonOk) {
      // Not JSON: try bare keys, Rust serde_json debug, Rust struct debug, key=value logs.
      var conv;
      try { conv = convertToJson(text); }
      catch (e) { showPlain("Could not convert this input: " + e.message); resetOutput(); return; }
      if (!conv) { showError(inEd.getValue(), jsonErr); resetOutput(); return; }
      text = conv.text;
      label += " · " + conv.note;
    }

    // Expand string fields holding JSON or Rust debug output, at any depth.
    var ctx = { texts: [], dbg: 0, json: 0 }, walked;
    try { walked = expandDebug(JSON.parse(protectNumbers(text)), ctx); }
    catch (e) { showError(text, e); resetOutput(); return; }
    if (ctx.texts.length) {
      text = splice(JSON.stringify(walked), ctx);
      if (ctx.json) label += " · nested JSON expanded";
      if (ctx.dbg) label += " · Rust debug converted";
    }

    try { JSON.parse(text); } catch (e) { showError(text, e); resetOutput(); return; }
    var unit = mode === "minify" ? null : unitFor(indentSel.value);
    setOutput(rewrite(text, unit), label);
    setMode(mode);
    inputDirty = false;
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }

  copyBtn.addEventListener("click", function () {
    var t = outEd.getValue();
    if (!t) return;
    copy(t).then(function () {
      copyBtn.textContent = "Copied"; copyBtn.classList.add("done");
    }).catch(function () {
      copyBtn.textContent = "Copy failed";
    }).then(function () {
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        copyBtn.textContent = "Copy"; copyBtn.classList.remove("done");
      }, 1600);
    });
  });

  // Editors (created last: they need the highlighter defined above).
  inEd = makeEditor($("inHost"), {
    placeholder: "Paste JSON, JSON inside strings, Rust debug output ({:?}) or key=value log lines here, then choose Format."
  });
  outEd = makeEditor($("outHost"), {
    placeholder: "The formatted JSON appears here. It is editable, and Find / Replace works on both sides."
  });
  inEd.onInput(function () {
    inputDirty = true;
    var v = inEd.getValue();
    inMeta.textContent = v ? fmtBytes(new Blob([v]).size) : "";
  });
  outEd.onInput(onOutputEdited);
  [[inEd, $("inFold")], [outEd, $("outFold")]].forEach(function (pair) {
    var ed = pair[0], btn = pair[1];
    ed.onFold(function (st) {
      btn.textContent = st.folded ? "Unfold all" : "Fold all";
      btn.disabled = !st.folded && st.regions === 0;
    });
    btn.addEventListener("click", function () { if (ed.hasFolds()) ed.unfoldAll(); else ed.foldAll(); });
  });
  $("inFind").addEventListener("click", function () { inEd.openFind(false); });
  $("outFind").addEventListener("click", function () { outEd.openFind(false); });

  $("format").addEventListener("click", function () { run("format"); });
  minifyBtn.addEventListener("click", function () {
    apply(currentMode === "minify" ? "format" : "minify");
  });
  wrapBtn.addEventListener("click", function () {
    setWrap(wrapBtn.getAttribute("aria-pressed") !== "true");
  });
  try { if (localStorage.getItem("jsonFormatterWrap") === "1") setWrap(true); } catch (e) {}
  $("clear").addEventListener("click", function () {
    inEd.setValue(""); clearError(); resetOutput(); inMeta.textContent = ""; inputDirty = false; inEd.focus();
  });
  indentSel.addEventListener("change", function () {
    if (outEd.getValue() && currentMode === "format") apply("format");
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run("format"); }
  });
})();
</script>
</body>
</html>
