<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSON Diff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="tools.css">
<style>
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    min-height: calc(100dvh - 58px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
    max-width: 1500px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
  }
  h1 {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 auto 0 0;
    color: var(--ink);
  }
  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  button, select {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    min-height: 32px;
    line-height: 1.2;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  select {
    background: var(--panel);
  }
  button:hover:not(:disabled) {
    background: var(--ink);
    color: var(--bg);
  }
  select:hover {
    border-color: var(--accent);
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  button:disabled:hover {
    background: transparent;
    color: var(--ink);
  }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:active:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary {
    background: var(--ink);
    border: 1px solid var(--ink);
    color: var(--bg);
    font-weight: 500;
  }
  button.primary:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary:active:not(:disabled) {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  button.primary:disabled:hover {
    background: var(--ink);
    color: var(--bg);
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
  }
  .hint.kbd {
    font-family: var(--mono);
    font-size: 12px;
  }

  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .inputs { grid-template-columns: 1fr; } .hint.kbd { display: none; } }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 42px;
    padding: 6px 12px 6px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    font-weight: 500;
    font-size: 14px;
  }
  .pane-head .meta {
    font-family: var(--mono);
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    margin-left: 8px;
  }
  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 0 7px;
    margin-right: 8px;
    border-radius: 4px;
    font: 600 12px/20px var(--mono);
    text-align: center;
  }
  .badge.a { background: var(--rem-bg); color: var(--rem-ink); }
  .badge.b { background: var(--add-bg); color: var(--add-ink); }
  textarea.src {
    display: block;
    width: 100%;
    height: 210px;
    min-height: 90px;
    margin: 0;
    border: 0;
    padding: 12px 14px;
    resize: vertical;
    background: transparent;
    color: var(--ink);
    font: 13px/1.55 var(--mono);
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }
  textarea.src::placeholder { color: var(--muted); }
  .err {
    display: none;
    margin: 0;
    padding: 9px 14px;
    background: var(--err-bg);
    color: var(--err);
    border-top: 1px solid var(--line);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .err.show { display: block; }

  .opts {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 13px;
  }
  .opts label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .opts select, .opts input[type="text"] {
    min-height: 32px;
    padding: 3px 10px;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .opts select { border-radius: 999px; }
  .opts input[type="text"] { border-radius: 4px; }
  .opts input.keyname { width: 110px; font-family: var(--mono); }
  .opts input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .opts .sp { margin-left: auto; }

  .results {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: clip;
  }
  .results[hidden] { display: none; }
  .summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 3px 12px;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer;
    transition: none;
  }
  .chip b { font-family: var(--mono); font-weight: 600; }
  .chip[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; text-decoration-color: transparent; }
  .chip.changed { color: var(--chg); }
  .chip.added { color: var(--add-ink); }
  .chip.removed { color: var(--rem-ink); }
  .chip.same { color: var(--ink-2); }
  .chip.changed[aria-pressed="true"] { background: var(--chg-bg); border-color: var(--chg); }
  .chip.added[aria-pressed="true"] { background: var(--add-bg); border-color: var(--add-ink); }
  .chip.removed[aria-pressed="true"] { background: var(--rem-bg); border-color: var(--rem-ink); }
  .chip.same[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--ink-2); }
  .chip:hover {
    background: var(--panel-2);
    color: inherit;
    border-color: var(--ink-2);
  }
  .chip.changed[aria-pressed="true"]:hover { background: var(--chg-bg); border-color: var(--chg); color: var(--chg); }
  .chip.added[aria-pressed="true"]:hover { background: var(--add-bg); border-color: var(--add-ink); color: var(--add-ink); }
  .chip.removed[aria-pressed="true"]:hover { background: var(--rem-bg); border-color: var(--rem-ink); color: var(--rem-ink); }
  .chip.same[aria-pressed="true"]:hover { background: var(--accent-soft); border-color: var(--ink-2); color: var(--ink-2); }

  .toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar input[type="text"] {
    flex: 1 1 200px;
    min-width: 0;
    min-height: 32px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .toolbar input[type="text"]::placeholder { color: var(--muted); }
  .toolbar button { min-height: 32px; padding: 4px 12px; font-size: 13px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 999px 0 0 999px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 999px 999px 0; }
  .seg button:hover, .seg button:focus-visible, .seg button[aria-pressed="true"] { z-index: 1; }
  button.toggle[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }
  button.toggle[aria-pressed="true"]:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .banner { padding: 18px 16px; color: var(--ok); font-weight: 500; }
  .banner.muted { color: var(--ink-2); font-weight: 400; }
  .note { padding: 8px 14px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); }

  /* rows */
  .thead, .row { display: grid; grid-template-columns: minmax(220px, 34%) minmax(0, 1fr) minmax(0, 1fr); }
  .thead {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .thead > div { padding: 7px 12px; }
  .row { border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row > div { padding: 5px 12px; min-width: 0; }
  .k {
    font-family: var(--mono);
    overflow-wrap: anywhere;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    border-left: 3px solid transparent;
  }
  .k .lbl { min-width: 0; }
  .k .full { display: block; color: var(--ink-2); font-size: 11.5px; }
  .v { font-family: var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .v.empty { color: var(--ink-2); opacity: 0.55; }
  .v .ty {
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 4px;
    font: 500 10.5px/16px var(--sans);
    background: var(--panel-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .s-str { color: var(--t-str); }
  .s-num { color: var(--t-num); }
  .s-lit { color: var(--t-lit); }
  .row.changed > .k { border-left-color: var(--chg); }
  .row.added > .k { border-left-color: var(--add-ink); }
  .row.removed > .k { border-left-color: var(--rem-ink); }
  .row.changed > .va, .row.removed > .va { background: var(--rem-bg); }
  .row.changed > .vb, .row.added > .vb { background: var(--add-bg); }
  .row.same > .k { color: var(--ink-2); }
  mark.hd { color: inherit; border-radius: 3px; padding: 0 1px; }
  .va mark.hd { background: var(--rem-hl); }
  .vb mark.hd { background: var(--add-hl); }
  .row.group { cursor: pointer; background: var(--panel-2); user-select: none; }
  .row.group:hover { background: var(--accent-soft); }
  .row.group .k { align-items: center; font-weight: 500; }
  .row.group .gm {
    grid-column: 2 / 4;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    color: var(--ink-2);
  }
  .caret { flex: none; width: 14px; height: 14px; position: relative; }
  .caret::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 2px;
    width: 6px;
    height: 6px;
    border-right: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 0.12s;
  }
  .row.group.open .caret::before { transform: translate(1px, 1px) rotate(45deg); }
  .pill { display: inline-block; padding: 0 8px; border-radius: 999px; font: 600 12px/20px var(--mono); }
  .pill.changed { background: var(--chg-bg); color: var(--chg); }
  .pill.added { background: var(--add-bg); color: var(--add-ink); }
  .pill.removed { background: var(--rem-bg); color: var(--rem-ink); }
  .size { font-size: 12px; }
  .kids[hidden] { display: none; }

  @media (max-width: 800px) {
    .thead { display: none; }
    .row { grid-template-columns: 1fr; }
    .row.group .gm { grid-column: 1; padding-top: 0; }
    .row:not(.group) > .va::before, .row:not(.group) > .vb::before {
      display: block;
      font: 600 11px/1.6 var(--sans);
      color: var(--ink-2);
    }
    .row:not(.group) > .va::before { content: "A"; }
    .row:not(.group) > .vb::before { content: "B"; }
  }
</style>
<script src="theme.js"></script>
</head>

<header class="site-header">
  <div class="site-header-inner">
    <a href="index.html" class="site-brand">Jayasuriya <em>MK</em></a>
    <nav class="site-nav">

        <span class="site-toggle-label">Light</span>
      </button>

</header>

<div class="app">
  <div class="bar">
    <h1>JSON diff</h1>
    <div class="controls">
      <span class="hint kbd">Ctrl/⌘+Enter to compare</span>
      <button id="example" type="button">Example</button>
      <button id="swap" type="button" title="Swap A and B">Swap A ⇄ B</button>
      <button id="clear" type="button">Clear</button>
      <button id="compare" type="button" class="primary">Compare</button>
    </div>
  </div>

  <div class="inputs">
    <section class="pane" aria-label="JSON A">
      <div class="pane-head"><span><span class="badge a">A</span>Before<span class="meta" id="metaA"></span></span></div>
      <textarea class="src" id="inA" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste JSON A here. Rust debug output ({:?}) and JSON inside strings are understood too."></textarea>
      <p class="err" id="errA" role="alert"></p>
    </section>
    <section class="pane" aria-label="JSON B">
      <div class="pane-head"><span><span class="badge b">B</span>After<span class="meta" id="metaB"></span></span></div>
      <textarea class="src" id="inB" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste JSON B here."></textarea>
      <p class="err" id="errB" role="alert"></p>
    </section>
  </div>

  <div class="opts">
    <label>Arrays
      <select id="arrMode" aria-label="How to match array items">
        <option value="index">compare by position</option>
        <option value="key">match items by key</option>
        <option value="unordered">ignore order</option>
      </select>
    </label>
    <label id="keyWrap" hidden>Key field <input type="text" class="keyname" id="keyName" value="id" spellcheck="false" autocomplete="off" autocapitalize="off"></label>
    <label><input type="checkbox" id="expand" checked> Expand JSON inside strings</label>
    <span class="hint sp">Fields are compared one by one and listed A–Z at every level.</span>
  </div>

  <section class="results" id="results" hidden aria-label="Differences">
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <span class="seg" role="group" aria-label="View">
        <button id="vTree" type="button" class="toggle" aria-pressed="true">Tree</button>
        <button id="vFlat" type="button" class="toggle" aria-pressed="false">Flat list</button>
      </span>
      <input type="text" id="search" placeholder="Filter by field name or value" aria-label="Filter fields" spellcheck="false" autocomplete="off" autocapitalize="off">
      <button id="expandAll" type="button">Expand all</button>
      <button id="collapseAll" type="button">Collapse all</button>
      <button id="copy" type="button">Copy report</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  
  // Decodes a Rust string literal ("..." with Rust escapes) starting at src[i].
  // Returns { s: decoded string, end: index after the closing quote }.
  function decodeRustString(src, i) {
    var n = src.length, out = "", start = i;
    i++;
    while (i < n && src[i] !== '"') {
      var c = src[i];
      if (c === "\\") {
        var d = src[i + 1]; i += 2;
        if (d === "n") out += "\n";
        else if (d === "r") out += "\r";
        else if (d === "t") out += "\t";
        else if (d === "0") out += "\0";
        else if (d === "\\" || d === '"' || d === "'") out += d;
        else if (d === "u") {
          var m = /^\{([0-9a-fA-F]{1,6})\}/.exec(src.slice(i, i + 9));
          if (!m) throw new Error("bad \\u escape at character " + i);
          out += String.fromCodePoint(parseInt(m[1], 16));
          i += m[0].length;
        } else if (d === "x") {
          out += String.fromCharCode(parseInt(src.slice(i, i + 2), 16));
          i += 2;
        } else throw new Error("bad escape \\" + d + " at character " + (i - 2));
      } else { out += c; i++; }
    }
    if (i >= n) throw new Error("unterminated string starting at character " + start);
    return { s: out, end: i + 1 };
  }

  // Converts the `{:?}` / `{:#?}` output of a serde_json::Value, e.g.
  //   Some(Object {"a": String("x"), "n": Number(1.5), "l": Array [Null, Bool(true)]})
  // into JSON text. Number literals are copied verbatim (no precision loss).
  function debugToJson(src) {
    var i = 0, n = src.length;
    function fail(m) { throw new Error(m + " at character " + i); }
    function ws() {
      while (i < n) {
        var c = src.charCodeAt(i);
        if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break;
      }
    }
    function peek(s) { ws(); return src.slice(i, i + s.length) === s; }
    function eat(s) { if (!peek(s)) fail("expected '" + s + "'"); i += s.length; }
    function rustString() {
      ws();
      if (src[i] !== '"') fail("expected a string");
      var r = decodeRustString(src, i);
      i = r.end;
      return JSON.stringify(r.s);
    }
    function value() {
      ws();
      if (peek("Some(")) { eat("Some("); var sv = value(); eat(")"); return sv; }
      if (peek("None")) { eat("None"); return "null"; }
      if (peek("Null")) { eat("Null"); return "null"; }
      if (peek("Bool(")) {
        eat("Bool(");
        var b;
        if (peek("true")) { eat("true"); b = "true"; } else { eat("false"); b = "false"; }
        eat(")");
        return b;
      }
      if (peek("Number(")) {
        eat("Number("); ws();
        var j = i;
        while (j < n && src[j] !== ")") j++;
        var num = src.slice(i, j).trim();
        if (!/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(num)) fail("bad number '" + num + "'");
        i = j; eat(")");
        return num;
      }
      if (peek("String(")) { eat("String("); var s = rustString(); eat(")"); return s; }
      if (peek("Array")) {
        eat("Array"); eat("[");
        var items = [];
        while (!peek("]")) {
          items.push(value());
          if (peek(",")) eat(","); else break;
        }
        eat("]");
        return "[" + items.join(",") + "]";
      }
      if (peek("Object")) {
        eat("Object"); eat("{");
        var ent = [];
        while (!peek("}")) {
          var k = rustString(); eat(":");
          ent.push(k + ":" + value());
          if (peek(",")) eat(","); else break;
        }
        eat("}");
        return "{" + ent.join(",") + "}";
      }
      fail("unexpected token");
    }
    var res = value(); ws();
    if (i < n) fail("unexpected trailing text");
    return res;
  }

  // Also matches the JSON-escaped form: Some(Object {\"a\": String(\"x\")})
  var DEBUG_START = /^\s*(?:Some\(\s*)?(?:Object\s*\{|Array\s*\[|String\(\s*\\?"|Number\(|Bool\(|Null\b)/;
  function looksLikeDebug(s) { return DEBUG_START.test(s); }

  // Raw pasted debug text. Returns null when the text isn't debug output,
  // throws when it looks like debug output but can't be converted.
  function tryDebug(text) {
    if (!looksLikeDebug(text)) return null;
    try { return debugToJson(text); }
    catch (e1) {
      if (text.indexOf('\\"') !== -1) {
        var unescaped = null;
        try { unescaped = JSON.parse('"' + text + '"'); } catch (e) {}
        if (unescaped !== null) { try { return debugToJson(unescaped); } catch (e) {} }
      }
      throw e1;
    }
  }

  // Walks parsed JSON and swaps string fields that hold either
  //   - a JSON object/array encoded as a string ("{\"a\": 1}"), or
  //   - Rust debug output,
  // for a placeholder; the converted text is spliced back in by splice().
  // Nested cases (JSON string inside a JSON string, debug inside either) are
  // expanded recursively. ctx = { texts: [], dbg: 0, json: 0 }.
  function expandDebug(v, ctx) {
    if (typeof v === "string") {
      var t = v.trim(), c = t.charAt(0), e = t.charAt(t.length - 1);

    k.appendChild(el("span", "caret"));
    k.appendChild(el("span", "lbl", n.label));
    k.title = n.path;
    r.appendChild(k);
    var gm = el("div", "gm");
    var unit = n.kind === "object" ? ["key", "keys"] : ["item", "items"];
    function cnt(v) { var c = n.kind === "object" ? Object.keys(v).length : v.length; return c; }
    function word(c) { return c === 1 ? unit[0] : unit[1]; }
    var size;
    if (n.a !== MISSING && n.b !== MISSING && cnt(n.a) !== cnt(n.b)) size = cnt(n.a) + " → " + cnt(n.b) + " " + unit[1];
    else { var c1 = cnt(n.b !== MISSING ? n.b : n.a); size = c1 + " " + word(c1); }
    gm.appendChild(el("span", "size", (n.kind === "object" ? "{ } " : "[ ] ") + size));
    if (n.status === "added") gm.appendChild(el("span", "pill added", "added"));
    if (n.status === "removed") gm.appendChild(el("span", "pill removed", "removed"));
    if (n.status === "changed") {
      if (n.counts.changed) gm.appendChild(pill("changed", n.counts.changed));
      if (n.counts.added) gm.appendChild(pill("added", n.counts.added));
      if (n.counts.removed) gm.appendChild(pill("removed", n.counts.removed));
    }
    if (n.status === "same") gm.appendChild(el("span", "size", "unchanged"));
    if (n.note) gm.appendChild(el("span", "size", n.note));
    r.appendChild(gm);

    function toggle() {
      n.open = !n.open;
      r.classList.toggle("open", n.open);
      r.setAttribute("aria-expanded", n.open ? "true" : "false");
      body.hidden = !n.open;
      if (n.open && !body.firstChild) fill(n, depth + 1, body);
    }
    r.addEventListener("click", toggle);
    r.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
    return r;
  }

  function fill(n, depth, parent) {
    n.children.forEach(function (c) { renderNode(c, depth, parent); });
  }

  function renderNode(n, depth, parent) {
    if (!n.v) return;
    if (isLeaf(n)) {
      if (rows >= ROW_CAP) { capped = true; return; }
      rows++;
      parent.appendChild(leafRow(n, depth, false));
      return;
    }
    var body = el("div", "kids");
    body.hidden = !n.open;
    parent.appendChild(groupRow(n, depth, body));
    parent.appendChild(body);
    if (n.open) fill(n, depth + 1, body);
  }

  function collectLeaves(n, out) {
    if (!n.v) return;
    if (isLeaf(n)) out.push(n); else n.children.forEach(function (c) { collectLeaves(c, out); });
  }

  function head() {
    var h = el("div", "thead");
    h.appendChild(el("div", "", "Field"));
    h.appendChild(el("div", "", "A · before"));
    h.appendChild(el("div", "", "B · after"));
    return h;
  }

  function render() {
    var root = state.root;
    var list = $("list");
    list.textContent = "";
    if (!root) return;
    mark(root);
    rows = 0; capped = false;

    var c = root.counts;
    var sum = $("summary");
    sum.textContent = "";
    [["changed", "Changed"], ["added", "Only in B"], ["removed", "Only in A"], ["same", "Unchanged"]].forEach(function (d) {
      var b = el("button", "chip " + d[0]);
      b.type = "button";
      b.setAttribute("aria-pressed", state.f[d[0]] ? "true" : "false");
      var n = el("b", "", String(c[d[0]]));
      b.appendChild(n); b.appendChild(document.createTextNode(d[1]));
      b.addEventListener("click", function () { state.f[d[0]] = !state.f[d[0]]; render(); });
      sum.appendChild(b);
    });
    var total = c.changed + c.added + c.removed;
    sum.appendChild(el("span", "hint", total ? total + " difference" + (total === 1 ? "" : "s") + " in " + (total + c.same) + " fields" : (total + c.same) + " fields compared"));

    if (!total && !state.q) {
      list.appendChild(el("div", "banner", "No differences. A and B are identical."));
      if (!state.f.same) list.appendChild(el("div", "note", "Turn on “Unchanged” above to list every field."));
    }
    if (!root.v) {
      if (total || state.q) list.appendChild(el("div", "banner muted", state.q ? "No fields match this filter." : "Nothing to show with the current filters."));
      return;
    }

    list.appendChild(head());
    var box = el("div", "tree");
    list.appendChild(box);
    if (state.view === "flat") {
      var leaves = [];
      collectLeaves(root, leaves);
      leaves.forEach(function (n) {
        if (rows >= ROW_CAP) { capped = true; return; }
        rows++;
        box.appendChild(leafRow(n, 0, true));
      });
    } else if (isLeaf(root)) {
      rows++;
      box.appendChild(leafRow(root, 0, false));
    } else {
      fill(root, 0, box);
    }
    if (capped) list.appendChild(el("div", "note", "Showing the first " + ROW_CAP + " rows. Use the filter or the chips above to narrow the list."));
  }

  function setAllOpen(n, open) {
    if (!n.children) return;
    n.open = open;
    n.children.forEach(function (c) { setAllOpen(c, open); });
  }

  // ---------------------------------------------------------------------------
  // Compare / wiring
  // ---------------------------------------------------------------------------
  var inA = $("inA"), inB = $("inB"), results = $("results");

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }
  function showErr(which, msg) {
    var e = $("err" + which);
    e.textContent = msg;
    e.classList.toggle("show", !!msg);
  }
  function explain(e) {
    var m = String(e && e.message || e).replace(/^JSON\.parse: /, "");
    return "Invalid JSON: " + m;
  }

  function compare() {
    showErr("A", ""); showErr("B", "");
    var ta = inA.value.trim(), tb = inB.value.trim(), ok = true, va, vb;
    opt.arr = $("arrMode").value;
    opt.key = $("keyName").value.trim() || "id";
    var expand = $("expand").checked;
    if (!ta) { showErr("A", "Paste JSON for A."); ok = false; }
    else { try { va = toValue(ta, expand); } catch (e) { showErr("A", explain(e)); ok = false; } }
    if (!tb) { showErr("B", "Paste JSON for B."); ok = false; }
    else { try { vb = toValue(tb, expand); } catch (e) { showErr("B", explain(e)); ok = false; } }
    if (!ok) { results.hidden = true; state.root = null; return; }
    state.root = diff(va, vb, "", "");
    if (state.root.children && state.root.counts.changed + state.root.counts.added + state.root.counts.removed) state.root.open = true;
    results.hidden = false;
    render();
    if (results.getBoundingClientRect().top > window.innerHeight * 0.7) results.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  function report() {
    var lines = [];
    (function walk(n) {
      if (!isLeaf(n)) { n.children.forEach(walk); return; }
      if (n.status === "same") return;
      var p = n.path || "(root)";
      if (n.status === "changed") lines.push("CHANGED  " + p + ": " + leafText(n.a) + " → " + leafText(n.b));
      else if (n.status === "added") lines.push("ADDED    " + p + ": " + leafText(n.b));
      else lines.push("REMOVED  " + p + ": " + leafText(n.a));
    })(state.root);
    return lines.join("\n") || "No differences.";
  }

  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(t); t.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t);
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  var EX_A = { code: "20260AD796", status: "open", tip: 0, totalIncl: 100, clientName: "IOS TEST IPAD", isClosed: false,
    items: { "06257F": { title: "Adai Avial", quantity: 4, priceIncl: 20, modifiers: [], categories: [{ id: "c1", title: "Dosa" }] },
             "140569": { title: "APicbase item", quantity: 2, priceIncl: 10, vat: 9 } },
    payments: [{ id: "p1", method: "cash", total: 100 }], tags: ["a", "b", "c"], updatedOn: 1791369052.745071 };
  var EX_B = { code: "20260AD796", status: "paid", tip: 5, totalIncl: 100, clientName: "IOS TEST IPAD", isClosed: true, loyalty: { points: 12 },
    items: { "06257F": { title: "Adai Avial KDS", quantity: 3, priceIncl: 20, modifiers: [{ title: "Extra" }], categories: [{ id: "c1", title: "Dosa" }] },
             "9ZZZZ": { title: "Fries", quantity: 1, priceIncl: 12 } },
    payments: [{ id: "p1", method: "card", total: 100 }, { id: "p2", method: "cash", total: 5 }], tags: ["c", "a"], updatedOn: 1791369053.207179 };

  function meta(ta, id) { $(id).textContent = ta.value ? fmtBytes(new Blob([ta.value]).size) : ""; }
  inA.addEventListener("input", function () { meta(inA, "metaA"); });
  inB.addEventListener("input", function () { meta(inB, "metaB"); });

  $("compare").addEventListener("click", compare);
  $("example").addEventListener("click", function () {
    inA.value = JSON.stringify(EX_A, null, 2); inB.value = JSON.stringify(EX_B, null, 2);
    meta(inA, "metaA"); meta(inB, "metaB"); compare();
  });
  $("swap").addEventListener("click", function () {
    var t = inA.value; inA.value = inB.value; inB.value = t;
    meta(inA, "metaA"); meta(inB, "metaB");
    if (!results.hidden) compare();
  });
  $("clear").addEventListener("click", function () {
    inA.value = ""; inB.value = ""; meta(inA, "metaA"); meta(inB, "metaB");
    showErr("A", ""); showErr("B", ""); results.hidden = true; state.root = null; inA.focus();
  });
  ["arrMode", "keyName", "expand"].forEach(function (id) {
    $(id).addEventListener("change", function () {
      $("keyWrap").hidden = $("arrMode").value !== "key";
      if (!results.hidden) compare();
    });
  });
  $("keyName").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); compare(); } });
  $("arrMode").addEventListener("change", function () { $("keyWrap").hidden = $("arrMode").value !== "key"; });

  function setView(v) {
    state.view = v;
    $("vTree").setAttribute("aria-pressed", v === "tree" ? "true" : "false");
    $("vFlat").setAttribute("aria-pressed", v === "flat" ? "true" : "false");
    $("expandAll").disabled = $("collapseAll").disabled = v === "flat";
    render();
  }
  $("vTree").addEventListener("click", function () { setView("tree"); });
  $("vFlat").addEventListener("click", function () { setView("flat"); });
  $("expandAll").addEventListener("click", function () { if (state.root) { setAllOpen(state.root, true); render(); } });
  $("collapseAll").addEventListener("click", function () { if (state.root) { setAllOpen(state.root, false); state.root.open = true; render(); } });
  var searchTimer = null;
  $("search").addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = $("search").value.trim().toLowerCase();
      if (state.q && state.root) setAllOpen(state.root, true);
      render();
    }, 120);
  });
  var copyTimer = null;
  $("copy").addEventListener("click", function () {
    if (!state.root) return;
    var b = $("copy");
    copy(report()).then(function () { b.textContent = "Copied"; }).catch(function () { b.textContent = "Copy failed"; }).then(function () {
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () { b.textContent = "Copy report"; }, 1600);
    });
  });
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); compare(); }
  });
})();
</script>
</body>
</html>
